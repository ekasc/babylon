<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws://127.0.0.1:5173 http://127.0.0.1:5173; font-src 'self' data:; object-src 'none'; base-uri 'self'" />
    <meta name="theme-color" content="#f4f6fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#03050b" media="(prefers-color-scheme: dark)" />
    <title>Babylon</title>
    <script>
      // Theme bootstrap: runs before React to avoid a flash of the wrong theme.
      (() => {
        const LIGHT = "#f4f6fa";
        const DARK = "#03050b";
        const meta = document.querySelector('meta[name="theme-color"]');
        try {
          const stored = window.localStorage.getItem("pideck:theme");
          const theme = stored === "light" || stored === "dark" || stored === "system" ? stored : "dark";
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const isDark = theme === "dark" || (theme === "system" && prefersDark);
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.style.colorScheme = isDark ? "dark" : "light";
          const chrome = isDark ? DARK : LIGHT;
          document.documentElement.style.backgroundColor = chrome;
          meta?.setAttribute("content", chrome);
        } catch {
          document.documentElement.classList.add("dark");
          document.documentElement.style.backgroundColor = DARK;
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      body {
        background: #f4f6fa;
        color: #14171c;
        font-family: "DM Sans Variable", "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      html.dark body {
        background: #03050b;
        color: #eaecf0;
      }
      #boot-shell {
        display: flex;
        min-height: 100%;
        align-items: center;
        justify-content: center;
        background: inherit;
      }
      #boot-shell-card {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 96px;
        height: 96px;
        border-radius: 24px;
        background: #111722;
        color: #eaecf0;
        font-size: 48px;
        font-weight: 600;
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      html:not(.dark) #boot-shell-card {
        background: #14171c;
        color: #f4f6fa;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(0.94);
          opacity: 0.8;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-shell-card {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-shell">
        <div id="boot-shell-card" aria-label="Babylon splash screen">&#960;</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
