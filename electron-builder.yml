appId: com.babylon.app
productName: Babylon
directories:
  output: release
  buildResources: build
beforePack: "./scripts/prepare-pi-for-pack.mjs"
afterPack: "./scripts/prune-locales.mjs"
files:
  - dist/**/*
  - "!dist/**/*.map"
  - dist-electron/**/*
  - "!dist-electron/**/*.map"
  - dist-daemon/**/*
  - "!dist-daemon/**/*.map"
  - package.json
  - from: node_modules/.pi-pack/pi-coding-agent
    to: node_modules/@earendil-works/pi-coding-agent
    filter:
      - "**/*"
      - "!node_modules/**/*"
  - from: node_modules/.pi-pack/pi-coding-agent/node_modules
    to: node_modules/@earendil-works/pi-coding-agent/node_modules
asar: true
asarUnpack:
  - "**/node_modules/@earendil-works/pi-coding-agent/**/*"
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  icon: build/icon.icns
linux:
  target: AppImage
  icon: build/icon.png
win:
  target: nsis
  icon: build/icon.ico
