name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Several tests run `git commit` against ephemeral repos. A
      # fresh runner has no git identity, which fails those tests.
      # Set a global identity as a belt-and-suspenders measure; the
      # tests that need a specific identity set it locally.
      - name: Configure git identity
        run: |
          git config --global user.email "ci@babylon.local"
          git config --global user.name  "Babylon CI"
      # @earendil-works/pi-coding-agent is a declared, locked dependency, so
      # pnpm install already placed it in node_modules. link-pi.mjs imports the
      # SDK in a child process, which catches a broken install (missing sibling
      # packages) here rather than at app startup.
      - name: Smoke-test the Pi SDK
        run: node scripts/link-pi.mjs
      - name: typecheck
        run: pnpm run typecheck
      - name: test
        run: pnpm run test
      - name: build
        run: pnpm run build
